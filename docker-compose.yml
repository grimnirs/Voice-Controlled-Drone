services:
  # ── Simulation: ArduPilot SITL + Gazebo Harmonic + MAVLink Router ──
  sim:
    image: ghcr.io/grimnirs/sim:v0.3    # Ladda ner den färdiga miljön
    build:
      context: .
      dockerfile: sim/Dockerfile                     
    container_name: sim
    ports:
      - "14550:14550/udp"   # MAVLink UDP — QGC auto-connects here
    environment:
      - ARDUPILOT_CUSTOM_PARAMS=--nosync --param AHRS_EKF_TYPE=3 --param EK3_SRC1_POSXY=6 --param EK3_SRC1_POSZ=6 --param EK3_SRC1_VELXY=6 --param EK3_SRC1_VELZ=6 --param EK3_SRC1_YAW=6 --param VISO_TYPE=1
      - GZ_WORLD=iris_warehouse.sdf   # Change to load a different world
    volumes:
      - ./ardupilot_gazebo:/home/ardupilot/ardupilot_gazebo
      - ./sim/entrypoint.sh:/home/ardupilot/entrypoint.sh
      - ./worlds:/home/ardupilot/custom_worlds:ro    # Drop custom .sdf worlds here
      - ./models:/home/ardupilot/custom_models:ro    # Drop custom drone models here
    tty: true
    stdin_open: true

  # ── Logic Engine: Python + MAVSDK ─────────────────────────────────
  logic-engine:
    image: ghcr.io/grimnirs/logic-engine:v0.2  # Ladda ner den färdiga miljön
    build: ./logic-engine                   
    container_name: logic-engine
    depends_on:
      - sim
    environment:
      - SITL_ADDRESS=tcpout://sim:5790
    volumes:
      - ./logic-engine:/app    #
    tty: true

  vision-injector:
    build: 
      context: .
      dockerfile: vision-injector/Dockerfile # Ensure this points to your Dockerfile path
    container_name: vision-injector
    depends_on:
      - sim
    environment:
      - SITL_ADDRESS=udpin://0.0.0.0:14552 #ska det inte vara udpout
    restart: always