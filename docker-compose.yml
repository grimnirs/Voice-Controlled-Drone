# -- Vision Injector ---------------------------------
  vision-injector:
    build: ./vision_efk
    container_name: vision-injector
    ports:
      - "14551:14551/udp"
    depends_on:
      - sim
    environment:
      - SITL_ADDRESS=udpin://0.0.0.0:14551
    tty: true
    restart: unless-stopped
  
