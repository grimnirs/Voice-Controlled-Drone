services:
  # ── Simulation: ArduPilot SITL + Gazebo Harmonic + MAVLink Router ──
  sim:
    image: ghcr.io/grimnirs/sim:v0.2    # Ladda ner den färdiga miljön
    # build: ./sim                      # Avkommentera för att bygga om lokalt
    container_name: sim
    ports:
      - "14550:14550/udp"   # MAVLink UDP — QGC auto-connects here
    environment:
      - GZ_WORLD=iris_runway.sdf   # Change to load a different world
    volumes:
      - ./worlds:/home/ardupilot/custom_worlds:ro    # Drop custom .sdf worlds here
      - ./models:/home/ardupilot/custom_models:ro    # Drop custom drone models here
    tty: true
    stdin_open: true

  # ── Logic Engine: Python + MAVSDK ─────────────────────────────────
  logic-engine:
    image: ghcr.io/grimnirs/logic-engine:v0.2  # Ladda ner den färdiga miljön
    # build: ./logic-engine                    # Avkommentera för att bygga om lokalt
    container_name: logic-engine
    depends_on:
      - sim
    environment:
      - SITL_ADDRESS=tcpout://sim:5790
    volumes:
      - ./logic-engine:/app    #
    tty: true